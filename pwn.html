<!DOCTYPE html>
<html lang="en">
<head>

    <title>PWNED! WebView Hijacked!</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(18, 18, 30, 0.7);
            --bg-card-hover: rgba(25, 25, 40, 0.8);
            --bg-input: rgba(10, 10, 18, 0.9);
            --border-color: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(255, 255, 255, 0.1);
            --text-primary: #e8e8f0;
            --text-secondary: #8b8ba0;
            --text-muted: #5a5a70;
            --red: #ff3b5c;
            --red-glow: rgba(255, 59, 92, 0.3);
            --red-soft: rgba(255, 59, 92, 0.12);
            --green: #00e5a0;
            --green-glow: rgba(0, 229, 160, 0.3);
            --green-soft: rgba(0, 229, 160, 0.12);
            --blue: #00b4ff;
            --blue-glow: rgba(0, 180, 255, 0.3);
            --blue-soft: rgba(0, 180, 255, 0.12);
            --purple: #a855f7;
            --purple-glow: rgba(168, 85, 247, 0.3);
            --purple-soft: rgba(168, 85, 247, 0.12);
            --yellow: #fbbf24;
            --yellow-soft: rgba(251, 191, 36, 0.12);
            --orange: #fb923c;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            font-size: 14px;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background gradient */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse 600px 400px at 20% 10%, rgba(255, 59, 92, 0.08), transparent),
                radial-gradient(ellipse 500px 500px at 80% 50%, rgba(0, 180, 255, 0.06), transparent),
                radial-gradient(ellipse 400px 300px at 50% 90%, rgba(168, 85, 247, 0.05), transparent);
            pointer-events: none;
            z-index: 0;
            animation: bgShift 20s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* Scanline overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        #app {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Top banner */
        .banner {
            background: linear-gradient(135deg, rgba(255, 59, 92, 0.15), rgba(255, 59, 92, 0.05));
            border: 1px solid rgba(255, 59, 92, 0.25);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            animation: bannerSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes bannerSlideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--red), transparent);
            animation: scanLine 3s linear infinite;
        }

        @keyframes scanLine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .banner-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--red);
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .banner-title .skull {
            font-size: 1.6rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .banner-subtitle {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 6px;
            font-family: var(--font-mono);
        }

        /* Info grid */
        .info-grid {
            display: grid;
            gap: 8px;
            margin-bottom: 20px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            overflow: hidden;
            transition: border-color var(--transition-fast);
        }

        .info-row:hover {
            border-color: var(--border-glow);
        }

        .info-label {
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .info-value {
            color: var(--green);
            word-break: break-all;
            overflow-wrap: anywhere;
        }

        /* Section cards */
        .section {
            margin-bottom: 12px;
            animation: fadeIn 0.8s ease-out both;
        }

        .section:nth-child(2) { animation-delay: 0.1s; }
        .section:nth-child(3) { animation-delay: 0.15s; }
        .section:nth-child(4) { animation-delay: 0.2s; }
        .section:nth-child(5) { animation-delay: 0.25s; }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            user-select: none;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
        }

        .section-header::after {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent);
            transition: opacity var(--transition-fast);
        }

        .section-header:hover::after {
            opacity: 1;
        }

        .section-header .icon {
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .section-header .chevron {
            margin-left: auto;
            font-size: 0.75rem;
            transition: transform var(--transition-smooth);
            color: inherit;
            opacity: 0.5;
        }

        .section-header.expanded .chevron {
            transform: rotate(90deg);
        }

        .section-header.red {
            background: var(--red-soft);
            color: var(--red);
            border: 1px solid rgba(255, 59, 92, 0.2);
        }
        .section-header.red:hover { border-color: rgba(255, 59, 92, 0.4); }

        .section-header.green {
            background: var(--green-soft);
            color: var(--green);
            border: 1px solid rgba(0, 229, 160, 0.2);
        }
        .section-header.green:hover { border-color: rgba(0, 229, 160, 0.4); }

        .section-header.blue {
            background: var(--blue-soft);
            color: var(--blue);
            border: 1px solid rgba(0, 180, 255, 0.2);
        }
        .section-header.blue:hover { border-color: rgba(0, 180, 255, 0.4); }

        .section-header.purple {
            background: var(--purple-soft);
            color: var(--purple);
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        .section-header.purple:hover { border-color: rgba(168, 85, 247, 0.4); }

        .section-body {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
            transition: max-height var(--transition-smooth), opacity var(--transition-smooth), padding var(--transition-smooth);
        }

        .section-body.collapsed {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
            border: none;
        }

        /* Variable tree */
        .var-entry {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px;
            padding: 3px 0;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            line-height: 1.5;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .var-entry:last-child {
            border-bottom: none;
        }

        .var-toggle {
            cursor: pointer;
            font-weight: 700;
            color: var(--blue);
            user-select: none;
            width: 18px;
            text-align: center;
            flex-shrink: 0;
            transition: color var(--transition-fast);
        }

        .var-toggle:hover {
            color: var(--text-primary);
        }

        .var-key {
            font-weight: 600;
            color: var(--text-primary);
            cursor: default;
            word-break: break-all;
        }

        .var-key.clickable {
            cursor: pointer;
        }

        .var-key.clickable:hover {
            text-decoration: underline;
        }

        .var-value {
            color: var(--text-secondary);
            word-break: break-all;
            overflow-wrap: anywhere;
        }

        .var-value.string { color: var(--yellow); font-style: italic; }
        .var-value.object { color: var(--text-muted); }
        .var-value.list { color: var(--text-muted); }
        .var-value.type { color: var(--text-muted); }
        .var-value.function {
            color: var(--red);
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 3px;
            transition: color var(--transition-fast);
        }
        .var-value.function:hover { color: var(--orange); }
        .var-value.result {
            color: var(--text-muted);
            font-style: italic;
            text-decoration: none;
            cursor: default;
        }

        .var-children {
            width: 100%;
            padding-left: 16px;
            border-left: 2px solid rgba(0, 180, 255, 0.15);
            margin-left: 7px;
            margin-top: 2px;
        }

        .var-children.hidden {
            display: none;
        }

        /* Badge/counter */
        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 1px 7px;
            border-radius: 100px;
            font-family: var(--font-mono);
        }

        .section-header.red .badge {
            background: rgba(255, 59, 92, 0.2);
            color: var(--red);
        }
        .section-header.green .badge {
            background: rgba(0, 229, 160, 0.2);
            color: var(--green);
        }
        .section-header.blue .badge {
            background: rgba(0, 180, 255, 0.2);
            color: var(--blue);
        }
        .section-header.purple .badge {
            background: rgba(168, 85, 247, 0.2);
            color: var(--purple);
        }

        /* JS Shell */
        .shell-container {
            font-family: var(--font-mono);
            display: flex;
            flex-direction: column;
        }

        .shell-output {
            max-height: 300px;
            overflow-y: auto;
            padding: 8px 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }

        .shell-output::-webkit-scrollbar {
            width: 4px;
        }

        .shell-output::-webkit-scrollbar-track {
            background: transparent;
        }

        .shell-output::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .shell-line {
            font-size: 0.78rem;
            padding: 2px 0;
            line-height: 1.5;
            word-break: break-all;
        }

        .shell-line.cmd {
            color: var(--text-muted);
            cursor: pointer;
            transition: color var(--transition-fast);
        }

        .shell-line.cmd:hover {
            color: var(--text-primary);
        }

        .shell-line.result { color: var(--green); }
        .shell-line.error { color: var(--red); }
        .shell-line.log { color: var(--blue); }

        .shell-input-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            margin-top: 8px;
            transition: border-color var(--transition-fast);
        }

        .shell-input-row:focus-within {
            border-color: rgba(255, 59, 92, 0.3);
            box-shadow: 0 0 0 3px rgba(255, 59, 92, 0.06);
        }

        .shell-prompt {
            color: var(--red);
            font-weight: 700;
            padding-top: 2px;
            flex-shrink: 0;
            user-select: none;
        }

        .shell-textarea {
            flex: 1;
            background: transparent;
            color: var(--text-primary);
            border: none;
            outline: none;
            resize: none;
            overflow: hidden;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            line-height: 1.5;
        }

        .shell-run-btn {
            flex-shrink: 0;
            padding: 4px 14px;
            background: linear-gradient(135deg, var(--red), #cc2040);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .shell-run-btn:hover {
            background: linear-gradient(135deg, #ff4d6e, var(--red));
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 59, 92, 0.3);
        }

        .shell-run-btn:active {
            transform: translateY(0);
        }

        /* PostMessage port section */
        .port-msg {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            padding: 3px 0;
            color: var(--text-secondary);
        }

        .port-msg.web { color: var(--green); }
        .port-msg.app { color: var(--blue); }

        /* Pills container for Cordova etc. */
        #pills-container {
            display: none;
            margin-bottom: 12px;
        }

        /* Timestamp footer */
        .footer {
            text-align: center;
            padding: 24px 0 16px 0;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-family: var(--font-mono);
            opacity: 0.5;
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            #app { padding: 10px; }
            .banner { padding: 14px 16px; }
            .banner-title { font-size: 1.1rem; }
            .section-header { padding: 10px 12px; font-size: 0.82rem; }
            .section-body { padding: 10px 12px; }
        }

        /* Glow animation for new sections */
        @keyframes glowIn {
            from { box-shadow: 0 0 20px rgba(0, 180, 255, 0.3); }
            to { box-shadow: none; }
        }

        .glow-in {
            animation: glowIn 1.5s ease-out;
        }
    </style>
</head>

,"onbeforetoggle","oncontentvisibilityautostatechange","oncontextlost","oncontextrestored","onsecuritypolicyviolation","onslotchange","onscrollend","onscrollsnapchange","onscrollsnapchanging","speechSynthesis","webkitRequestFileSystem","webkitResolveLocalFileSystemURL","THIS_WINDOW","DEFAULT_WINDOW"];

        const VARS = THIS_WINDOW.filter(item => !DEFAULT_WINDOW.includes(item));

        // ── DOM References ──
        const infoGrid = document.getElementById('info-grid');
        const sectionsContainer = document.getElementById('sections-container');
        const pillsContainer = document.getElementById('pills-container');
        const bannerSubtitle = document.getElementById('banner-subtitle');
        const footer = document.getElementById('footer');

        // ── Populate environment info ──
        const infoItems = [
            { label: 'location', value: String(window.location) },
            { label: 'origin', value: String(window.location.origin) },
            { label: 'cookie', value: document.cookie || '(empty)' },
            { label: 'userAgent', value: window.navigator.userAgent || window.navigator.appVersion }
        ];

        infoItems.forEach(({ label, value }) => {
            const row = document.createElement('div');
            row.className = 'info-row';
            row.innerHTML = `<span class="info-label">${label}:</span><span class="info-value">${escapeHTML(value)}</span>`;
            infoGrid.appendChild(row);
        });

        bannerSubtitle.textContent = `${VARS.length} injected variable${VARS.length !== 1 ? 's' : ''} detected · ${new Date().toLocaleString()}`;

        // ── Utility: escape HTML ──
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ── Create a collapsible section ──
        function createSection(title, colorClass, iconEmoji, initiallyOpen, badgeCount) {
            const section = document.createElement('div');
            section.className = 'section';

            const header = document.createElement('div');
            header.className = `section-header ${colorClass}${initiallyOpen ? ' expanded' : ''}`;
            header.innerHTML = `
                <span class="icon">${iconEmoji}</span>
                <span>${escapeHTML(title)}</span>
                ${badgeCount !== undefined ? `<span class="badge">${badgeCount}</span>` : ''}
                <span class="chevron">▶</span>
            `;

            const body = document.createElement('div');
            body.className = `section-body${initiallyOpen ? '' : ' collapsed'}`;

            header.addEventListener('click', () => {
                const isCollapsed = body.classList.contains('collapsed');
                body.classList.toggle('collapsed');
                header.classList.toggle('expanded');
            });

            section.appendChild(header);
            section.appendChild(body);
            return { section, body, header };
        }

        // ── Variable tree renderer ──
        function renderVarTree(container, obj, keys, depth) {
            depth = depth || 0;
            keys.forEach(k => {
                const entry = document.createElement('div');
                entry.className = 'var-entry';

                const keyEl = document.createElement('span');
                keyEl.className = 'var-key';
                keyEl.textContent = k;

                const valEl = document.createElement('span');
                valEl.className = 'var-value';

                let v;
                try { v = obj[k]; } catch (e) { valEl.textContent = `<access error>`; valEl.classList.add('type'); entry.append(keyEl, document.createTextNode(' '), valEl); container.appendChild(entry); return; }

                if (Array.isArray(v)) {
                    const preview = v.slice(0, 5).map(i => typeof i === 'function' ? 'ƒ()' : String(i)).join(', ');
                    valEl.textContent = `[${preview}${v.length > 5 ? `, … +${v.length - 5}` : ''}]`;
                    valEl.classList.add('list');
                    entry.append(keyEl, document.createTextNode(' '), valEl);

                } else if (typeof v === 'object' && v !== null) {
                    let label;
                    try { label = v.toString ? v.toString() : '…'; } catch(e) { label = '…'; }
                    valEl.textContent = `{${label}}`;
                    valEl.classList.add('object');

                    let childKeys;
                    try { childKeys = Object.keys(v); } catch(e) { childKeys = []; }

                    if (depth < 4 && childKeys.length > 0) {
                        const toggle = document.createElement('span');
                        toggle.className = 'var-toggle';
                        toggle.textContent = '▸';

                        const childContainer = document.createElement('div');
                        childContainer.className = 'var-children hidden';

                        const doToggle = (e) => {
                            if (e && e.target !== e.currentTarget) return;
                            const isHidden = childContainer.classList.contains('hidden');
                            childContainer.classList.toggle('hidden');
                            toggle.textContent = isHidden ? '▾' : '▸';
                        };

                        toggle.addEventListener('click', doToggle);
                        keyEl.classList.add('clickable');
                        keyEl.addEventListener('click', doToggle);
                        valEl.style.cursor = 'pointer';
                        valEl.addEventListener('click', doToggle);

                        // Lazy render children on first expand
                        let rendered = false;
                        const origToggle = doToggle;
                        toggle.addEventListener('click', () => { if (!rendered) { renderVarTree(childContainer, v, childKeys, depth + 1); rendered = true; } }, { once: true });
                        keyEl.addEventListener('click', () => { if (!rendered) { renderVarTree(childContainer, v, childKeys, depth + 1); rendered = true; } }, { once: true });
                        valEl.addEventListener('click', () => { if (!rendered) { renderVarTree(childContainer, v, childKeys, depth + 1); rendered = true; } }, { once: true });

                        entry.append(toggle, keyEl, document.createTextNode(' '), valEl);
                        entry.appendChild(childContainer);
                    } else {
                        entry.append(keyEl, document.createTextNode(' '), valEl);
                    }

                } else if (typeof v === 'string') {
                    valEl.textContent = `"${v}"`;
                    valEl.classList.add('string');
                    entry.append(keyEl, document.createTextNode(' '), valEl);

                } else if (typeof v === 'function') {
                    valEl.textContent = 'ƒ() { … }  click to execute';
                    valEl.classList.add('function');
                    valEl.addEventListener('click', () => {
                        try {
                            const result = obj[k]();
                            valEl.textContent = `→ ${String(result)}`;
                        } catch (err) {
                            valEl.textContent = `⚠ ${err.message}`;
                        }
                        valEl.className = 'var-value result';
                    });
                    entry.append(keyEl, document.createTextNode(' '), valEl);

                } else {
                    valEl.textContent = String(typeof v);
                    valEl.classList.add('type');
                    entry.append(keyEl, document.createTextNode(' '), valEl);
                }

                container.appendChild(entry);
            });
        }

        // ── JavaScript Shell Section ──
        const shellSection = createSection('JavaScript Shell', 'red', '⚡', true);
        sectionsContainer.appendChild(shellSection.section);
        setupJSShell(shellSection.body);

        // ── HTTP Headers (if available via server injection) ──
        // This will be populated server-side similar to the original
        // For now, show basic request info
        const requestHeaders = {};
        if (Object.keys(requestHeaders).length > 0) {
            const headersSection = createSection('HTTP Request Headers', 'blue', '📡', false, Object.keys(requestHeaders).length);
            renderVarTree(headersSection.body, requestHeaders, Object.keys(requestHeaders));
            sectionsContainer.appendChild(headersSection.section);
        }

        // ── Cookies ──
        if (document.cookie) {
            const cookieObj = {};
            document.cookie.split(';').forEach(c => {
                const [key, ...vParts] = c.trim().split('=');
                if (key) cookieObj[key] = decodeURIComponent(vParts.join('='));
            });
            const cookieSection = createSection('Cookies', 'blue', '🍪', false, Object.keys(cookieObj).length);
            renderVarTree(cookieSection.body, cookieObj, Object.keys(cookieObj));
            sectionsContainer.appendChild(cookieSection.section);
        }

        // ── Local Storage ──
        try {
            if (window.localStorage && Object.keys(localStorage).length > 0) {
                const lsSection = createSection('Local Storage', 'blue', '💾', false, Object.keys(localStorage).length);
                renderVarTree(lsSection.body, localStorage, Object.keys(localStorage));
                sectionsContainer.appendChild(lsSection.section);
            }
        } catch(e) {}

        // ── Session Storage ──
        try {
            if (window.sessionStorage && Object.keys(sessionStorage).length > 0) {
                const ssSection = createSection('Session Storage', 'purple', '📦', false, Object.keys(sessionStorage).length);
                renderVarTree(ssSection.body, sessionStorage, Object.keys(sessionStorage));
                sectionsContainer.appendChild(ssSection.section);
            }
        } catch(e) {}

        // ── Cordova Detection ──
        if (VARS.includes('cordova')) {
            try {
                const cordovaKeys = [...new Set([...Object.keys(window.cordova), ...Object.getOwnPropertyNames(window.cordova)])];
                const cs = createSection('Cordova Detected', 'green', '📱', false, cordovaKeys.length);
                renderVarTree(cs.body, window.cordova, cordovaKeys);
                pillsContainer.appendChild(cs.section);
                pillsContainer.style.display = 'block';
            } catch(e) {}
        }

        if (VARS.includes('Cordova')) {
            try {
                const cordovaKeys = [...new Set([...Object.keys(window.Cordova), ...Object.getOwnPropertyNames(window.Cordova)])];
                const cs = createSection('window.Cordova', 'green', '📱', false, cordovaKeys.length);
                renderVarTree(cs.body, window.Cordova, cordovaKeys);
                pillsContainer.appendChild(cs.section);
                pillsContainer.style.display = 'block';
            } catch(e) {}
        }

        if (VARS.includes('BuildInfo')) {
            try {
                const biKeys = [...new Set([...Object.keys(window.BuildInfo), ...Object.getOwnPropertyNames(window.BuildInfo)])];
                const cs = createSection('BuildInfo (Cordova)', 'green', '🏗️', false, biKeys.length);
                renderVarTree(cs.body, window.BuildInfo, biKeys);
                pillsContainer.appendChild(cs.section);
                pillsContainer.style.display = 'block';
            } catch(e) {}
        }

        // ── Window Variables (injected JS bridges) ──
        if (VARS.length > 0) {
            const varsSection = createSection('Injected Window Variables', 'purple', '🔓', false, VARS.length);
            renderVarTree(varsSection.body, window, VARS);
            sectionsContainer.appendChild(varsSection.section);
        }

        // ── PostMessage Port Listener ──
        let ports = [];
        let portCount = 0;

        window.addEventListener('message', function (event) {
            if (!event.ports || event.ports.length === 0) return;
            const port = event.ports[0];
            if (ports.find(p => p === port)) return;

            const portIndex = portCount++;
            const portSection = createSection(
                `Port#${portIndex + 1} Messages [origin: ${event.origin || 'null'}]`,
                'blue', '🔌', true
            );
            portSection.section.classList.add('glow-in');

            const portMsgContainer = document.createElement('div');
            portSection.body.appendChild(portMsgContainer);

            function postToApp(msg) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'port-msg web';
                msgDiv.textContent = `[web] → ${msg}`;
                portMsgContainer.appendChild(msgDiv);
                port.postMessage(msg);
            }

            portSection.header.addEventListener('click', (e) => {
                e.stopPropagation();
                postToApp(JSON.stringify({ message: 'Hello from the website!' }));
            });

            sectionsContainer.appendChild(portSection.section);
            ports.push(port);

            postToApp(JSON.stringify({ message: 'Hello from the website!' }));

            port.onmessage = function (event) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'port-msg app';
                try {
                    msgDiv.textContent = `[app] ← ${JSON.stringify(JSON.parse(event.data), null, 2)}`;
                } catch (e) {
                    msgDiv.textContent = `[app] ← ${event.data}`;
                }
                portMsgContainer.appendChild(msgDiv);
            };
        });

        // ── JS Shell Setup ──
        function setupJSShell(container) {
            const shell = document.createElement('div');
            shell.className = 'shell-container';

            const output = document.createElement('div');
            output.className = 'shell-output';

            const inputRow = document.createElement('div');
            inputRow.className = 'shell-input-row';

            const prompt = document.createElement('span');
            prompt.className = 'shell-prompt';
            prompt.textContent = '>>>';

            const textarea = document.createElement('textarea');
            textarea.className = 'shell-textarea';
            textarea.rows = 1;
            textarea.spellcheck = false;
            textarea.autocomplete = 'off';
            textarea.placeholder = 'Type JavaScript here…';

            const runBtn = document.createElement('button');
            runBtn.className = 'shell-run-btn';
            runBtn.textContent = 'Run';

            inputRow.append(prompt, textarea, runBtn);
            shell.append(output, inputRow);
            container.appendChild(shell);

            let history = [];
            let historyIndex = 0;

            function autoResize() {
                textarea.style.height = 'auto';
                textarea.style.height = textarea.scrollHeight + 'px';
            }

            function appendLine(text, cls) {
                const line = document.createElement('div');
                line.className = `shell-line ${cls}`;
                line.textContent = text;
                output.appendChild(line);
                output.scrollTop = output.scrollHeight;
                inputRow.scrollIntoView({ block: 'nearest' });
            }

            // Capture console.log
            const origLog = console.log;
            console.log = (...args) => {
                appendLine(args.join(' '), 'log');
                origLog.apply(console, args);
            };

            window.onerror = (msg, src, line, col, err) => {
                appendLine(`Error: ${msg} at ${src}:${line}:${col}`, 'error');
                if (err && err.stack) appendLine(err.stack, 'error');
                return true;
            };

            function runCode(code) {
                const cmdLine = document.createElement('div');
                cmdLine.className = 'shell-line cmd';
                cmdLine.textContent = '>>> ' + code;
                cmdLine.addEventListener('click', () => {
                    textarea.value = code;
                    autoResize();
                    textarea.focus();
                });
                output.appendChild(cmdLine);

                try {
                    const result = eval(code);
                    appendLine(String(result), 'result');
                } catch (err) {
                    appendLine('Error: ' + err, 'error');
                }

                output.scrollTop = output.scrollHeight;
                inputRow.scrollIntoView({ block: 'nearest' });

                history.push(code);
                historyIndex = history.length;
                textarea.value = '';
                autoResize();
            }

            runBtn.addEventListener('click', () => {
                const code = textarea.value.trim();
                if (code) runCode(code);
            });

            textarea.addEventListener('input', autoResize);

            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey) {
                    e.preventDefault();
                    const code = textarea.value.trim();
                    if (code) runCode(code);
                } else if (e.key === 'ArrowUp' && history.length > 0) {
                    e.preventDefault();
                    if (historyIndex > 0) historyIndex--;
                    textarea.value = history[historyIndex] || '';
                    autoResize();
                } else if (e.key === 'ArrowDown' && history.length > 0) {
                    e.preventDefault();
                    if (historyIndex < history.length) historyIndex++;
                    textarea.value = history[historyIndex] || '';
                    autoResize();
                }
            });

            // Auto-execute ?js= parameter
            const params = new URLSearchParams(window.location.search);
            const jsParam = params.get('js');
            if (jsParam && jsParam.trim() !== '') {
                textarea.value = jsParam;
                autoResize();
            }

            autoResize();
        }

        // ── Footer ──
        footer.textContent = `poc-private · ${new Date().toISOString()}`;

    })();
