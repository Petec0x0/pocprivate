<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Secure Payment</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#1f2430; --muted:#8a92a6;
    --line:#e6e8ee; --brand:#f36805; --brand-ink:#ffffff; --field:#fbfbfc;
    --ok:#1a9e57; --focus:#f36805;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; flex-direction:column;
  }
  .bar{
    display:flex; align-items:center; gap:8px;
    padding:14px 16px; background:#fff; border-bottom:1px solid var(--line);
    position:sticky; top:0;
  }
  .bar .lock{width:16px;height:16px;flex:0 0 auto}
  .bar h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
  .bar .secured{margin-left:auto;font-size:11px;color:var(--ok);font-weight:600;display:flex;align-items:center;gap:4px}
  .wrap{flex:1;padding:18px 16px 28px;max-width:480px;width:100%;margin:0 auto}

  .notice{
    background:#fff7f0; border:1px solid #ffd9bd; border-radius:14px;
    padding:14px 16px; margin-bottom:16px; display:flex; gap:11px; align-items:flex-start;
  }
  .notice svg{flex:0 0 auto;margin-top:1px}
  .notice .title{font-size:14px;font-weight:700;color:#b45309;margin:0 0 3px}
  .notice .sub{font-size:13px;color:#7c6a58;line-height:1.45;margin:0}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 16px 8px; margin-bottom:16px;
  }
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 14px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
  .field{
    display:flex;align-items:center;gap:8px;
    background:var(--field); border:1.5px solid var(--line); border-radius:11px;
    padding:0 12px; height:50px; margin-bottom:14px; transition:border-color .15s;
  }
  .field:focus-within{border-color:var(--focus)}
  .field input{
    border:0;background:transparent;outline:0;flex:1;
    font-size:16px;color:var(--ink);letter-spacing:.3px;font-family:inherit;
  }
  .field input::placeholder{color:#b9bfcc}
  .row{display:flex;gap:12px}
  .row .col{flex:1}
  .brands{display:flex;gap:6px;align-items:center}
  .brand{width:30px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;letter-spacing:.3px}
  .visa{background:#1a1f71}
  .mc{background:#eb001b;position:relative}
  .mc::after{content:"";position:absolute;right:6px;width:13px;height:13px;border-radius:50%;background:#f79e1b;mix-blend-mode:multiply}
  .amex{background:#2e77bc}
  .chiptag{font-size:11px;color:var(--muted)}

  .pay{
    width:100%;height:54px;border:0;border-radius:12px;
    background:var(--brand);color:var(--brand-ink);
    font-size:16px;font-weight:700;letter-spacing:.3px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 6px 16px rgba(243,104,5,.28);
  }
  .pay:active{transform:translateY(1px)}
  .foot{
    text-align:center;color:var(--muted);font-size:11px;line-height:1.5;
    margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .foot .lockrow{display:flex;align-items:center;gap:5px}
  svg{display:block}
</style>
</head>
<body>
  <div class="bar">
    <svg class="lock" viewBox="0 0 24 24" fill="none"><path d="M6 10V8a6 6 0 1112 0v2" stroke="#1f2430" stroke-width="2" stroke-linecap="round"/><rect x="4" y="10" width="16" height="10" rx="2.5" fill="#1f2430"/></svg>
    <h1>Secure Payment</h1>
    <span class="secured">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V5l8-3z" fill="#1a9e57"/><path d="M8.5 12l2.3 2.3L15.5 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Secured
    </span>
  </div>

  <div class="wrap">
    <div class="notice">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#f36805"/><path d="M12 7v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1.2" fill="#fff"/></svg>
      <div>
        <p class="title">Update your payment details</p>
        <p class="sub">We couldn't verify your saved card. Please re-enter your payment details before you continue.</p>
      </div>
    </div>

    <div class="card">
      <h2>Card details</h2>

      <label for="cardnum">Card number</label>
      <div class="field">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="3" fill="#c9cede"/><rect x="2" y="8" width="20" height="3" fill="#8a92a6"/></svg>
        <input id="cardnum" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" maxlength="19">
        <span class="brands">
          <span class="brand visa">VISA</span>
          <span class="brand mc"></span>
        </span>
      </div>

      <div class="row">
        <div class="col">
          <label for="exp">Expiry</label>
          <div class="field">
            <input id="exp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM / YY" maxlength="7">
          </div>
        </div>
        <div class="col">
          <label for="cvc">CVC</label>
          <div class="field">
            <input id="cvc" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4">
            <span class="chiptag">CVC</span>
          </div>
        </div>
      </div>

      <label for="name">Name on card</label>
      <div class="field">
        <input id="name" autocomplete="cc-name" placeholder="J. Smith">
      </div>
    </div>

    <button class="pay" type="button" onclick="return false;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 10V8a6 6 0 1112 0v2" stroke="#fff" stroke-width="2" stroke-linecap="round"/><rect x="4" y="10" width="16" height="10" rx="2.5" fill="#fff"/></svg>
      Save and continue
    </button>

    <div class="foot">
      <div class="lockrow">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 10V8a6 6 0 1112 0v2" stroke="#8a92a6" stroke-width="2" stroke-linecap="round"/><rect x="4" y="10" width="16" height="10" rx="2.5" fill="#8a92a6"/></svg>
        Payments protected with 256-bit TLS encryption
      </div>
      <div>Your card details are encrypted and never stored on your device.</div>
    </div>
  </div>

<script>
  // Cosmetic input formatting only. No submission, no storage, no network — demo mockup.
  const num = document.getElementById('cardnum');
  num.addEventListener('input', () => {
    let v = num.value.replace(/\D/g,'').slice(0,16);
    num.value = v.replace(/(.{4})/g,'$1 ').trim();
  });
  const exp = document.getElementById('exp');
  exp.addEventListener('input', () => {
    let v = exp.value.replace(/\D/g,'').slice(0,4);
    exp.value = v.length > 2 ? v.slice(0,2)+' / '+v.slice(2) : v;
  });
  const cvc = document.getElementById('cvc');
  cvc.addEventListener('input', () => { cvc.value = cvc.value.replace(/\D/g,'').slice(0,4); });
</script>
</body>
</html>
