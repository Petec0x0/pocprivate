<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>lean-camera-test</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; padding: 16px; }
  #status { font-size: 22px; white-space: pre-wrap; margin-bottom: 16px; }
  canvas { border: 4px solid #0f0; max-width: 100%; }
</style>
</head>
<body>
<div id="status">Requesting camera...</div>
<canvas id="c" width="480" height="360"></canvas>
<script>
  var statusEl = document.getElementById('status');
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function setStatus(msg) {
    statusEl.textContent = msg;
    document.title = msg.split('\n')[0];
  }

  setStatus('CAMERA_TEST: requesting getUserMedia...');

  navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(function (stream) {
    setStatus('CAMERA_TEST: RESULT=GRANTED (no OS prompt seen). Capturing frame...');
    var video = document.createElement('video');
    video.srcObject = stream;
    video.setAttribute('playsinline', '');
    video.muted = true;
    video.play();
    video.onloadedmetadata = function () {
      setTimeout(function () {
        try {
          canvas.width = video.videoWidth || 480;
          canvas.height = video.videoHeight || 360;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          setStatus('CAMERA_TEST: RESULT=GRANTED\nFrame captured ' + canvas.width + 'x' + canvas.height + ' at ' + new Date().toISOString());
          stream.getTracks().forEach(function (t) { t.stop(); });
        } catch (e) {
          setStatus('CAMERA_TEST: RESULT=CAPTURE_ERROR\n' + e);
        }
      }, 800);
    };
  }).catch(function (err) {
    setStatus('CAMERA_TEST: RESULT=DENIED\n' + err.name + ': ' + err.message);
  });
</script>
</body>
</html>
